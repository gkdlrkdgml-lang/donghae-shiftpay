<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근무·수당 관리</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f3a5f'/><rect x='12' y='16' width='40' height='36' rx='5' fill='%23fff'/><rect x='12' y='16' width='40' height='9' rx='4' fill='%230f766e'/><g fill='%231f3a5f'><rect x='18' y='30' width='7' height='6' rx='1'/><rect x='28.5' y='30' width='7' height='6' rx='1'/><rect x='39' y='30' width='7' height='6' rx='1'/><rect x='18' y='40' width='7' height='6' rx='1'/><rect x='28.5' y='40' width='7' height='6' rx='1'/></g></svg>">
<meta name="application-name" content="근무·수당 관리">
<meta name="theme-color" content="#1f3a5f">
<style>:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2433; --ink2:#4a5468; --ink3:#7b8497; --line:#e2e5eb; --line2:#cfd4dd;
  --pri:#1f3a5f; --pri2:#2c5282; --pri-soft:#e8eef6; --acc:#0f766e; --acc-soft:#e3f3f1;
  --red:#c0392b; --red-soft:#fdecea; --org:#b45309; --org-soft:#fff4e0; --blue:#1d4ed8; --blue-soft:#e6eefc; --sat:#1f4e99;
  --r:8px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(to right,var(--pri) 208px,var(--bg) 208px);font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:208px 1fr;min-height:100vh}
.side{background:var(--pri);color:#dfe7f2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand b{display:block;font-size:15px;color:#fff;letter-spacing:-.2px}
.brand span{font-size:12px;color:#9fb2cc}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:6px;font-size:14px;display:flex;align-items:center;gap:10px;color:#c9d5e6}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:#fff;color:var(--pri);font-weight:700}
.nav .ic{width:18px;text-align:center;opacity:.9}
.side .foot{margin-top:auto;padding:14px 16px;font-size:12px;color:#9fb2cc;border-top:1px solid rgba(255,255,255,.1);line-height:1.6}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.month{display:flex;align-items:center;gap:4px}
.month b{font-size:18px;min-width:118px;text-align:center;letter-spacing:-.3px}
.iconbtn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line)}
.iconbtn:hover{background:var(--bg)}
.top .sp{flex:1}
.saved{font-size:12px;color:var(--ink3)}
.btn{cursor:pointer;border:1px solid var(--line2);background:#fff;padding:7px 14px;border-radius:6px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{color:var(--red)}
.content{padding:22px 24px 60px;max-width:1500px}
h2{font-size:19px;margin:0 0 4px;letter-spacing:-.4px}
.sub{color:var(--ink3);font-size:13px;margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.card h3{font-size:15px;margin:0 0 12px;letter-spacing:-.2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:120px}
.fld label{font-size:12px;color:var(--ink2);font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line2);border-radius:6px;padding:7px 9px;background:#fff;min-height:35px}
.fld input:focus,.fld select:focus{outline:2px solid #bcd0ea;border-color:var(--pri2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font-size:13px;border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
.hint{font-size:12px;color:var(--ink3)}
.preview{margin-top:12px;padding:11px 13px;border-radius:6px;background:var(--pri-soft);font-size:13px;line-height:1.7}
.preview.warn{background:var(--org-soft);color:#7c4a03}
.preview.err{background:var(--red-soft);color:#8a1f12}
.chipbtn{all:unset;cursor:pointer;display:inline-block;padding:2px 9px;margin:2px 4px 2px 0;border-radius:99px;border:1px solid #b7c7de;background:#fff;font-size:12px}
.chipbtn:hover{background:var(--pri);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#f7f8fa;color:var(--ink2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:58px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:#fafbfc}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c,table.t th.c{text-align:center}
table.t tr.total td{font-weight:700;background:#f7f8fa}
table.t tr.sel td{background:var(--pri-soft)}
.tag{display:inline-block;white-space:nowrap;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:#eef0f3;color:var(--ink2)}
.tag.j{background:#e8eef6;color:var(--pri)} .tag.g{background:var(--acc-soft);color:var(--acc)}
.tag.k-연가{background:#e6f0ff;color:#1d4ed8}.tag.k-특별휴가{background:#f3e8ff;color:#7e22ce}.tag.k-병가{background:#fdecea;color:#b42318}.tag.k-공가{background:#e3f3f1;color:#0f766e}
.empty{padding:28px;text-align:center;color:var(--ink3)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi span{font-size:12px;color:var(--ink3)} .kpi b{display:block;font-size:22px;margin-top:4px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.alert{border:1px solid #f3d19c;background:var(--org-soft);color:#7c4a03;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px;line-height:1.7}
.alert b{color:#5c3700}
/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.cal .dh{padding:8px;text-align:center;font-size:12px;font-weight:700;color:var(--ink2);background:#f7f8fa;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .dh.sun{color:var(--red)} .cal .dh.sat{color:var(--sat)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px 8px;min-height:150px;font-size:12px;position:relative}
.cell.out{background:#fafafa}
.cell.out .ln{opacity:.55}
.cell.hol{background:#fffafa}
.cell .dn{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.cell .dn b{font-size:14px}
.cell .dn.sun b,.cell .dn.hol b{color:var(--red)} .cell .dn.sat b{color:var(--sat)}
.cell .dn em{font-style:normal;font-size:11px;color:var(--red);font-weight:600}
.cell .dn .add{margin-left:auto;all:unset;cursor:pointer;color:var(--ink3);font-size:15px;line-height:1;padding:0 3px;border-radius:4px}
.cell .dn .add:hover{background:var(--bg);color:var(--pri)}
.ln{display:flex;gap:4px;align-items:flex-start;margin:2px 0;line-height:1.35}
.ln .k{flex:0 0 26px;color:var(--ink3);font-size:11px;padding-top:2px}
.ln .k.j{color:var(--pri);font-weight:700}
.ln .v{display:flex;flex-wrap:wrap;gap:2px}
.nm{all:unset;cursor:pointer;padding:1px 6px;border-radius:4px;background:#f0f2f5;font-size:12px;white-space:nowrap}
.nm:hover{outline:1px solid var(--pri2)}
.nm.chg{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nm.lv{background:var(--red-soft);color:var(--red);text-decoration:line-through}
.nm.pl{background:var(--org-soft);color:var(--org)}
.sep{height:1px;background:var(--line);margin:4px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 12px}
.legend .nm{cursor:default}
.pop{position:fixed;z-index:50;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(16,24,40,.18);padding:12px;width:250px;font-size:13px}
.pop h4{margin:0 0 2px;font-size:14px} .pop p{margin:0 0 10px;color:var(--ink3);font-size:12px}
.pop .btn{width:100%;justify-content:flex-start;margin-top:6px}
/* 출력 미리보기 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-size:13.5px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
.paper{background:#fff;border:1px solid var(--line);box-shadow:var(--sh);padding:26px;overflow:auto}
table.x{border-collapse:collapse;font-size:12.5px;margin:0 auto;font-family:"Malgun Gothic","맑은 고딕",sans-serif}
table.x td{padding:3px 5px;white-space:pre-wrap;line-height:1.35}
table.x td.b{border:1px solid #333}
table.x td.hd{background:#eef1f5;font-weight:700}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.drawer{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.mini{width:100%;border-collapse:collapse;font-size:12px}
.mini th,.mini td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini th{color:var(--ink3);font-weight:600}
.edit input,.edit select{border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:4px;width:100%;min-width:60px}
.edit input:hover,.edit select:hover{border-color:var(--line2)}
.edit input:focus,.edit select:focus{border-color:var(--pri2);background:#fff;outline:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:1100px){.split{grid-template-columns:1fr}.drawer{position:static;max-height:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff!important}
  .side,.top,.noprint,.tabs,.sub,h2{display:none!important}
  .app{display:block}.content{padding:0}
  .paper{border:0;box-shadow:none;padding:0;overflow:visible}
  table.x{font-size:11px}
}
.edit input[type=number]{min-width:84px}
table.t td:first-child{white-space:nowrap}

table.t.inbox th{top:0;z-index:1}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>근무·수당 관리</b><span>동해시 안전정보센터</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">혼자 쓸 때는 인터넷 없이 동작합니다.<br>인터넷(Firebase)에 연결하면 여러 자리에서 함께 씁니다.</div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="month"><button class="iconbtn" data-mv="-1" title="이전 달">◀</button><b id="mlabel"></b><button class="iconbtn" data-mv="1" title="다음 달">▶</button></div>
      <span class="sp"></span>
      <span class="saved" id="saved"></span>
      <span id="acct"></span>
      <button class="btn" data-nav="result">₩ 수당 결과</button>
      <button class="btn pri" data-act="xlsx">⬇ 엑셀 내보내기</button>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>/* ===== 계산 엔진 (화면과 분리: Node에서 단독 검증 가능) ===== */
(function (G) {
  'use strict';
  const DAY = 1440;
  const KINDS = ['연가', '특별휴가', '병가', '공가'];
  const SHIFTS = {
    '주간': { role: '조장', s: 8 * 60, e: 20 * 60 },
    '야간': { role: '조장', s: 20 * 60, e: 32 * 60 },
    '새벽': { role: '관제', s: 0, e: 8 * 60 },
    '오전': { role: '관제', s: 8 * 60, e: 16 * 60 },
    '오후': { role: '관제', s: 16 * 60, e: 24 * 60 }
  };
  const SHIFT_ORDER = ['주간', '야간', '새벽', '오전', '오후'];
  // 순환 패턴 (엑셀 근무순환 탭과 동일)
  const PATTERN = {
    '주간': { len: 4, teams: [1, 4, 2, 3], off: 0 },
    '야간': { len: 4, teams: [1, 4, 2, 3], off: 3 },
    '새벽': { len: 8, teams: [1, 4, 4, 3, 3, 2, 2, 1], off: 0 },
    '오전': { len: 8, teams: [2, 2, 1, 1, 4, 4, 3, 3], off: 0 },
    '오후': { len: 8, teams: [3, 3, 2, 2, 1, 1, 4, 4], off: 0 }
  };

  // ---- 날짜 유틸 (UTC 일련번호 사용: 시간대 영향 없음) ----
  function dn(str) { // 'YYYY-MM-DD' -> day number
    const [y, m, d] = str.slice(0, 10).split('-').map(Number);
    return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  }
  function ds(n) { const d = new Date(n * 86400000); return d.toISOString().slice(0, 10); }
  function dow(n) { return new Date(n * 86400000).getUTCDay(); } // 0=일
  function mins(str) { // 'YYYY-MM-DDTHH:MM' -> 절대 분
    const n = dn(str); const t = str.length > 10 ? str.slice(11, 16) : '00:00';
    const [h, mi] = t.split(':').map(Number);
    return n * DAY + h * 60 + mi;
  }
  function fmtMins(m) { const n = Math.floor(m / DAY), r = m - n * DAY; return ds(n) + 'T' + String(Math.floor(r / 60)).padStart(2, '0') + ':' + String(r % 60).padStart(2, '0'); }
  function ymDays(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  const DOW_KO = ['일', '월', '화', '수', '목', '금', '토'];

  function overlap(a1, a2, b1, b2) { return Math.max(0, Math.min(a2, b2) - Math.max(a1, b1)); }
  // 구간 리스트에서 다른 구간들을 뺀 결과
  function subtract(base, cuts) {
    let res = [base];
    for (const c of cuts) {
      const next = [];
      for (const r of res) {
        if (c[1] <= r[0] || c[0] >= r[1]) { next.push(r); continue; }
        if (c[0] > r[0]) next.push([r[0], c[0]]);
        if (c[1] < r[1]) next.push([c[1], r[1]]);
      }
      res = next;
    }
    return res;
  }
  function nightOf(iv) { // 22:00~06:00 구간과 겹치는 분
    let t = 0;
    const d0 = Math.floor(iv[0] / DAY) - 1, d1 = Math.floor(iv[1] / DAY) + 1;
    for (let d = d0; d <= d1; d++) t += overlap(iv[0], iv[1], d * DAY + 22 * 60, d * DAY + 30 * 60);
    return t;
  }

  function activeOn(p, n) {
    if (p.start && n < dn(p.start)) return false;
    if (p.end && n > dn(p.end)) return false;
    return true;
  }

  // ---- 기본 근무표(순환) ----
  function baseShift(state, n, kind) {
    const base = dn(state.settings.baseDate || '2026-05-01');
    const pt = PATTERN[kind];
    const idx = (((n - base + pt.off) % pt.len) + pt.len) % pt.len;
    const team = pt.teams[idx];
    const role = SHIFTS[kind].role;
    return state.people.filter(p => p.role === role && Number(p.team) === team && activeOn(p, n)).map(p => p.id);
  }

  // ---- 근무변경 적용 ----
  function actualShift(state, n, kind, ctx) {
    const list = baseShift(state, n, kind).slice();
    const date = ds(n);
    const chs = state.changes.filter(c => c.date === date && c.shift === kind);
    for (const c of chs) {
      const fi = c.fromId ? list.indexOf(c.fromId) : -1;
      if (c.fromId && fi < 0 && ctx) ctx.warn.push({ type: 'change', id: c.id, msg: `${date} ${kind}: 변경 전 근무자(${nameOf(state, c.fromId)})가 원래 근무에 없습니다. 변경 후 근무자를 추가로 처리했습니다.` });
      if (fi >= 0) list.splice(fi, 1);
      if (c.toId && list.indexOf(c.toId) < 0) list.splice(fi >= 0 ? fi : list.length, 0, c.toId);
    }
    return list;
  }
  function nameOf(state, id) { const p = state.people.find(x => x.id === id); return p ? p.name : '(삭제된 인원)'; }

  function shiftInterval(n, kind) { return [n * DAY + SHIFTS[kind].s, n * DAY + SHIFTS[kind].e]; }

  // 휴가가 덮는 구간(해당 근무 기준)
  function leaveCuts(state, pid, n, kind) {
    const [s, e] = shiftInterval(n, kind);
    const cuts = [];
    for (const l of state.leaves) {
      if (l.pid !== pid) continue;
      if (l.mode === 'day') {
        if (n >= dn(l.from) && n <= dn(l.to)) cuts.push([s, e]);
      } else {
        const a = mins(l.start), b = mins(l.end);
        if (b > s && a < e) cuts.push([a, b]);
      }
    }
    return cuts;
  }

  // 휴가 1건의 차감시간(원래 근무표 기준, 없으면 실제 근무표 기준)
  function leaveHours(state, l, rangeFrom, rangeTo) {
    if (l.hours !== null && l.hours !== undefined && l.hours !== '' && rangeFrom === undefined) return Number(l.hours);
    let s, e;
    if (l.mode === 'day') { s = dn(l.from) - 1; e = dn(l.to) + 1; } else { s = Math.floor(mins(l.start) / DAY) - 1; e = Math.floor(mins(l.end) / DAY) + 1; }
    const p = state.people.find(x => x.id === l.pid); if (!p) return 0;
    const kinds = SHIFT_ORDER.filter(k => SHIFTS[k].role === p.role);
    const calc = (useActual) => {
      let t = 0;
      for (let n = s; n <= e; n++) {
        if (rangeFrom !== undefined && (n < rangeFrom || n > rangeTo)) continue;
        for (const k of kinds) {
          const mem = useActual ? actualShift(state, n, k) : baseShift(state, n, k);
          if (mem.indexOf(l.pid) < 0) continue;
          const [a, b] = shiftInterval(n, k);
          if (l.mode === 'day') { if (n >= dn(l.from) && n <= dn(l.to)) t += b - a; }
          else t += overlap(a, b, mins(l.start), mins(l.end));
        }
      }
      return t / 60;
    };
    let h = calc(false);
    if (h === 0) h = calc(true);
    if (rangeFrom !== undefined && l.hours !== null && l.hours !== undefined && l.hours !== '') {
      // 수동 입력 시간이 있으면 월 비율로 배분
      const all = leaveHours(Object.assign({}, state), Object.assign({}, l, { hours: null }));

<script>/* ===== 여러 자리 공유: 공유폴더의 데이터 파일 하나를 함께 읽고 씀 ===== */
(function (G) {
  'use strict';
  const COLL = { people: 'id', leaves: 'id', changes: 'id', extras: 'id', holidays: 'date', log: 'id' };

    async create(mine) {

<script>/* ===== 인터넷 공유: Firebase 실시간 DB + 총괄/개인 권한 =====

  function splitRates(st) { const r = {}; (st.people || []).forEach(p => { r[p.id] = {}; RATE_KEYS.forEach(k => r[p.id][k] = Number(p[k]) || 0); }); return r; }

  async function importFiles(files) {

  }

  function syncCard() {

        <div class="row" id="fbLogin" style="margin-top:10px"><div class="fld"><label>아이디</label><input name="email" autocomplete="username" placeholder="예: kanghee"></div><div class="fld"><label>비밀번호</label><input name="pw" type="password" autocomplete="current-password"></div><button class="btn pri" data-act="fbLogin">로그인</button><button class="btn ghost danger" data-act="fbOff">연결 설정 지우기</button></div>`

        <div class="row" style="margin-top:10px"><button class="btn" data-act="fbLogout">로그아웃</button>${isStaff() ? '' : '<button class="btn ghost danger" data-act="fbOff">공유 연결 끊기</button>'}</div>
        ${F.role === 'admin' ? `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><h3 style="margin:0 0 6px">개인 아이디 나눠 주기</h3>
          <ol class="hint" style="padding-left:18px;line-height:1.9;margin:0 0 10px"><li>Firebase 콘솔 → Authentication → 사용자 추가: <b>아이디@shiftpay.local</b> + 비밀번호</li><li>위 인원 표의 <b>로그인 아이디</b> 칸에 같은 아이디를 적습니다 (그 사람 본인 수당만 보이게 연결).</li><li><b>다른 PC용 설치 파일 만들기</b>로 받은 파일을 다른 PC(총괄 본인의 다른 자리 포함)와 직원들에게 나눠 줍니다. Firebase 설정이 들어 있어서 아이디·비밀번호만 넣으면 됩니다.</li><li>아래 <b>보안 규칙</b>을 Realtime Database → 규칙에 붙여넣고 게시합니다. (단가·인원 수정은 총괄만, 단가는 본인 것만 읽기)</li></ol>
          <div class="row"><button class="btn pri" data-act="staffFile">⬇ 다른 PC용 설치 파일 만들기</button><button class="btn" data-act="copyRules">보안 규칙 복사</button></div>
          <details style="margin-top:10px"><summary class="hint" style="cursor:pointer">보안 규칙 보기</summary><pre id="rulesTxt" style="background:#f4f5f7;padding:10px;border-radius:6px;font-size:11.5px;overflow:auto;max-height:260px">${h(FireSync.rulesText(F.user))}</pre></details></div>` : ''}`;
    } else if (S.linked) {
      body = `<div class="preview">${S.needPerm ? '파일 권한 확인이 필요합니다. 오른쪽 위 <b>공유 파일 다시 연결</b>을 눌러 주세요.' : S.error ? `<span style="color:var(--red)">${h(S.error)}</span>` : `<b style="color:var(--acc)">● 공유폴더 파일 공유 중</b> · ${h(S.name)}`}</div>
        <div class="row" style="margin-top:10px">${S.needPerm ? '<button class="btn acc" data-act="syncRe">다시 연결</button>' : '<button class="btn" data-act="syncNow">지금 동기화</button>'}<button class="btn ghost danger" data-act="syncOff">연결 끊기</button></div>`;
    } else {
      const mode = ui.syncMode || 'fb';
      body = `<div class="seg" style="margin-bottom:12px"><button data-smode="fb" class="${mode === 'fb' ? 'on' : ''}">인터넷 (Firebase)</button><button data-smode="file" class="${mode === 'file' ? 'on' : ''}">공유폴더 파일</button></div>` + (mode === 'fb' ? `
        <p class="hint" style="margin-top:0"><b>Firebase 실시간 DB</b>(근무수당 전용 프로젝트)에 데이터를 두고, 로그인한 자리끼리 실시간으로 함께 씁니다. 로그인하지 않으면 읽을 수도 없게 규칙을 걸어 둡니다.</p>
        <div id="fbForm"><div class="fld" style="margin-bottom:10px"><label>Firebase 설정 (콘솔의 firebaseConfig 그대로 붙여넣기)</label><textarea name="cfg" rows="6" style="font-family:Consolas,monospace;font-size:12px" placeholder="← 여기를 누르고 Ctrl+V로 붙여넣으세요.&#10;(Firebase 콘솔 → 프로젝트 설정 → 내 앱 → Config 에서 복사한&#10; const firebaseConfig = { ... }; 전체)"></textarea></div>
        <div class="row"><div class="fld"><label>아이디</label><input name="email" autocomplete="username" placeholder="예: kanghee"></div><div class="fld"><label>비밀번호</label><input name="pw" type="password" autocomplete="current-password"></div><button class="btn pri" data-act="fbConnect">연결</button></div></div>
        <details style="margin-top:12px"><summary class="hint" style="cursor:pointer"><b>처음 한 번 설정 방법 (펼치기)</b></summary><ol class="hint" style="padding-left:18px;line-height:1.9">
          <li>Firebase 콘솔에서 근무수당 전용 프로젝트를 만들고, 프로젝트 설정 → 내 앱 → 웹 앱 추가 → <b>firebaseConfig</b>를 복사해 위 칸에 붙여넣습니다.</li>
          <li>Realtime Database 만들기(위치: 싱가포르) → <b>규칙</b>에 아래를 넣고 게시합니다. <b>kanghee</b> 자리를 총괄 아이디로 바꾸세요. (연결 후에는 총괄 아이디가 채워진 규칙을 이 화면에서 복사할 수 있습니다)<pre style="background:#f4f5f7;padding:8px;border-radius:6px;font-size:11.5px;margin:6px 0;max-height:200px;overflow:auto">${h(FireSync.rulesText('kanghee'))}</pre></li>
          <li>Authentication → 이메일/비밀번호 사용 설정 → 사용자 추가에서 이메일 칸에 <b>아이디@shiftpay.local</b> (예: kanghee@shiftpay.local)로 계정을 만듭니다. 프로그램에서는 <b>아이디만</b> 입력하면 됩니다. 실제 메일 주소가 아니어도 됩니다.</li>
          <li><b>총괄 아이디로</b> 연결하면 "이 PC 내용을 올릴까요?"가 나옵니다 → 확인. 그다음 직원용 파일을 만들어 나눠 주면 됩니다.</li></ol></details>`
      : (!Sync.supported ? `<div class="preview warn">이 브라우저는 공유 파일 기능을 지원하지 않습니다. Edge 또는 Chrome으로 열어 주세요.</div>` : `<p class="hint" style="margin-top:0">공유폴더(네트워크 드라이브)에 데이터 파일 하나를 두고 함께 씁니다.</p><div class="row"><button class="btn pri" data-act="syncCreate">공유 파일 새로 만들기</button><button class="btn" data-act="syncOpen">기존 공유 파일 연결</button></div>`));
    }
    return `<div class="card" style="flex:1.4;min-width:380px"><h3>여러 자리에서 함께 쓰기</h3>${S.linked || (!F.linked && ui.syncMode === 'file') ? seatFld : ''}${body}${(F.linked && !F.needLogin) || S.linked ? logTable() : ''}</div>`;
  }

  function vAccount() {
    return `<h2>내 계정</h2><p class="sub">${h(FireSync.S.user)} 아이디로 로그인되어 있습니다.</p><div class="row" style="align-items:stretch">${syncCard()}</div>`;
  }
  function vLocked() {
    return `<h2>로그인</h2><p class="sub">오른쪽 위 <b>🔑 로그인</b> 버튼이나 아래 칸에 아이디와 비밀번호를 넣으세요.</p><div class="row" style="align-items:stretch">${syncCard()}</div>`;
  }
  function vWelcome() {
    const F = FireSync.S;
    return `<h2>시작하기</h2><p class="sub">아직 이 PC에 근무 데이터가 없습니다.</p>
    <div class="row" style="align-items:stretch">
      ${F.linked || FireSync.embedded() ? '' : `<div class="card" style="flex:1;min-width:320px"><h3>총괄 담당자 (처음 한 번)</h3><p class="hint" style="margin-top:0">함께 받은 <b>초기데이터 파일(.json)</b>을 불러오면 9월 엑셀 자료(인원·단가·휴가·근무변경)가 들어갑니다.</p><label class="btn pri">초기데이터·백업 파일 불러오기<input type="file" accept=".json" id="restore" hidden></label></div>`}
      ${syncCard()}
    </div>`;
  }

  // ---------- 이벤트 ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('button,a,[data-sel],label input');
    if (!e.target.closest('#pop') && !e.target.closest('[data-shift]')) closePop();
    if (!t) return;
    const ds = t.dataset;
    if (ds.nav) { ui.view = ds.nav; closePop(); render(); window.scrollTo(0, 0); return; }
    if (ds.mv) { let { y, m } = st.ui; m += Number(ds.mv); if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } st.ui = { y, m }; ui.leaveDraft = ui.chDraft = ui.exDraft = null; saveLocal(); render(); return; }
    if (ds.shift) {
      const [date, kind, pid] = ds.shift.split('|'); const p = person(pid); const tm = shiftTimes(date, kind);
      const rc = t.getBoundingClientRect();
      openPop(rc.left, rc.bottom, `<h4>${h(p.name)} · ${date.slice(5).replace('-', '/')} ${kind}</h4><p>${tm.start.slice(11)} ~ ${tm.end.slice(11)} (${p.role})</p>
        <button class="btn" data-pact="leave" data-arg="${ds.shift}">✈ 이 근무에 휴가 등록</button>
        <button class="btn" data-pact="swap" data-arg="${ds.shift}">⇄ 다른 사람이 대신 근무</button>
        <button class="btn" data-pact="extra" data-arg="${ds.shift}">＋ 추가근무 등록</button>`);
      return;
    }
    if (ds.addday) {
      const rc = t.getBoundingClientRect();
      openPop(rc.left - 200, rc.bottom, `<h4>${ds.addday.slice(5).replace('-', '/')} 입력</h4><p>이 날짜로 입력 화면을 엽니다.</p>
        <button class="btn" data-pact="leaveD" data-arg="${ds.addday}">✈ 휴가 등록</button><button class="btn" data-pact="swapD" data-arg="${ds.addday}">⇄ 근무자 변경</button><button class="btn" data-pact="extraD" data-arg="${ds.addday}">＋ 추가근무</button>`);
      return;
    }
    if (ds.pact) {
      closePop();
      const [date, kind, pid] = ds.arg.split('|');
      if (ds.pact === 'leave') { const tm = shiftTimes(date, kind); ui.leaveEdit = null; ui.leaveDraft = { pid, kind: '연가', mode: 'time', from: date, to: date, start: tm.start, end: tm.end, hours: '', memo: '' }; ui.view = 'leave'; }
      if (ds.pact === 'swap') { ui.chEdit = null; ui.chDraft = { date, shift: kind, fromId: pid, toId: '', memo: '' }; ui.view = 'change'; }
      if (ds.pact === 'extra') { ui.exEdit = null; ui.exDraft = { date, pid, hours: '', memo: '' }; ui.view = 'extra'; }
      if (ds.pact === 'leaveD') { ui.leaveEdit = null; ui.leaveDraft = Object.assign(leaveDraftDefault(), { from: date, to: date, start: date + 'T08:00', end: date + 'T16:00' }); ui.view = 'leave'; }
      if (ds.pact === 'swapD') { ui.chEdit = null; ui.chDraft = Object.assign(chDraftDefault(), { date }); ui.view = 'change'; }
      if (ds.pact === 'extraD') { ui.exEdit = null; ui.exDraft = { date, pid: '', hours: '', memo: '' }; ui.view = 'extra'; }
      render(); window.scrollTo(0, 0); return;
    }
    if (ds.lmode) { ui.leaveDraft = Object.assign(readForm('#leaveForm'), { mode: ds.lmode }); syncLeaveDates(ui.leaveDraft); render(); return; }
    if (ds.qshift) { const [s, en] = ds.qshift.split('|'); ui.leaveDraft = Object.assign(readForm('#leaveForm'), { mode: 'time', start: s, end: en }); render(); return; }
    if (ds.ledit) { const l = st.leaves.find(x => x.id === ds.ledit); ui.leaveEdit = l.id; ui.leaveDraft = Object.assign(leaveDraftDefault(), l, { hours: l.hours == null ? '' : l.hours }); syncLeaveDates(ui.leaveDraft); render(); window.scrollTo(0, 0); return; }

  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest && e.target.closest('#popLogin')) { const b = document.querySelector('[data-act="popLoginGo"],[data-act="pwGo"]'); if (b) b.click(); } });

  load();
  render();
  const cbs = { getState: () => st, setState: (o, other) => applyShared(o, other), onStatus: () => { const el = $('#saved'); if (el) el.innerHTML = syncBadge(); const ac = $('#acct'); if (ac) ac.innerHTML = acctHtml(); }, seat };
  Sync.init(cbs);
  FireSync.init(cbs).then(r => { if (r) return applyShared(r, false); if (FireSync.S.linked) return render(); Sync.restore().then(x => { if (x) applyShared(x, false); else render(); }); });
  document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) { pendingRender = false; render(); } }, 50));
})();
</script>
